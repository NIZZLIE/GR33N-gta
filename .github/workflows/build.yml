name: Build GR33N PS3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout GR33N
        uses: actions/checkout@v4

      - name: Build PS3 SDK image
        run: |
          git clone https://github.com/ps3dev/ps3dev-docker.git /tmp/ps3dev-docker

          sed -i '/git clone.*ps3toolchain/i\  apt-get update \&\& apt-get install -y cmake pkg-config python3 autoconf automake libtool \&\& \\' /tmp/ps3dev-docker/Dockerfile

          cat /tmp/ps3dev-docker/Dockerfile

          docker build -t ps3dev-local /tmp/ps3dev-docker

      - name: Compile GR33N
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/build/gr33n" \
            -w /build/gr33n \
            --entrypoint /bin/bash \
            ps3dev-local -c '
              set -e
              export PS3DEV=/usr/local/ps3dev
              export PSL1GHT=$PS3DEV
              export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
              ppu-gcc --version
              cmake --version
              sh deps/build-mbedtls.sh
              sh deps/build-libsrtp.sh
              sh deps/build-usrsctp.sh
              sh deps/build-libpeer.sh
              sh deps/build-opus.sh
              make
              make pkg
            '

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: GR33N-PS3
          path: "**/*.pkg"
          if-no-files-found: error
