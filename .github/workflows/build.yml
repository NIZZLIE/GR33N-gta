name: Build GR33N PS3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          echo "$PS3DEV/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/ppu/bin" >> "$GITHUB_PATH"
          echo "$PS3DEV/spu/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: ppu-gcc --version

      - name: Build dependencies
        run: |
          sh deps/build-mbedtls.sh
          sh deps/build-libsrtp.sh
          sh deps/build-usrsctp.sh
          sh deps/build-libpeer.sh
          sh deps/build-opus.sh

      - name: Build GR33N
        run: |
          make
          make pkg

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: GR33N-PS3
          path: "**/*.pkg"
          if-no-files-found: error
